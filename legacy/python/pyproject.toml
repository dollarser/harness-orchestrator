[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-orchestrator"
version = "0.1.0"
description = "Cost-aware orchestration across coding-agent harnesses"
requires-python = ">=3.11"
authors = [{name = "dollarser"}]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
harness-orchestrator = "harness_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
